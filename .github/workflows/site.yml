name: "Site"

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # First day of a month
    - cron: "0 0 1 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # To push a branch
      pages: write # To push to a GitHub Pages site
      id-token: write # To update the deployment status
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install plugin
        run: cargo install --git https://github.com/mainmatter/mdbook-exercise-linker
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Build book
        run: |
          cd book
          mdbook build
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # Only check HTML: lychee >= 0.20 also scans .txt/.css, which pulls in
          # mdbook's vendored font licenses (http:// links we don't control).
          # 404.html uses a root-relative <base href> that lychee can't resolve.
          args: |
            --exclude-loopback
            --require-https
            --no-progress
            --extensions html
            --exclude-path 'book/book/404\.html$'
            book/book
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload entire repository
          path: "book/book"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dprint/check@v2.5
