spin_manifest_version = 2

[application]
name = "key-value"
version = "1.0.0"

[[trigger.http]]
route = "/..."
component = "key-value"

[component.key-value]
source = "../../../target/wasm32-wasip2/debug/key_value.wasm"
key_value_stores = ["default"]

[component.key-value.build]
command = "cargo build -p key_value --target wasm32-wasip2"
watch = ["src/**/*.rs", "Cargo.toml"]
