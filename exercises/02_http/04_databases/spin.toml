spin_manifest_version = 2

[application]
name = "databases"
version = "1.0.0"

[[trigger.http]]
route = "/..."
component = "databases"

[component.databases]
source = "../../../target/wasm32-wasip2/debug/databases.wasm"
sqlite_databases = ["default"]

[component.databases.build]
command = "cargo build -p databases --target wasm32-wasip2"
watch = ["src/**/*.rs", "Cargo.toml"]
