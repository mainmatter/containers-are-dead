spin_manifest_version = 2

[application]
name = "spin"
version = "1.0.0"

[[trigger.http]]
route = "/..."
component = "spin"

[component.spin]
source = "../../../target/wasm32-wasip2/debug/spin.wasm"

[component.spin.build]
command = "cargo build -p spin --target wasm32-wasip2"
watch = ["src/**/*.rs", "Cargo.toml"]
