spin_manifest_version = 2

[application]
name = "handler"
version = "1.0.0"

[[trigger.http]]
route = "/..."
component = "handler"

[component.handler]
source = "../../../target/wasm32-wasip2/debug/handler.wasm"

[component.handler.build]
command = "cargo build -p handler --target wasm32-wasip2"
watch = ["src/**/*.rs", "Cargo.toml"]
